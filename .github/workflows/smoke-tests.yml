name: MarketLab Smoke Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-tests:
    name: Verify static app and PWA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run MarketLab smoke tests
        run: node --test scripts/smoke-test.mjs scripts/engine-test.mjs
      - name: Run desktop and mobile browser smoke tests
        run: node --test scripts/browser-test.mjs
      - name: Verify multi-tab writer locks and save conflict handling
        run: node --test scripts/multitab-test.mjs
      - name: Check live-site verification script syntax
        run: node --check scripts/live-deployment-check.mjs

  live-site:
    name: Verify published MarketLab
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: smoke-tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out release
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify public GitHub Pages version and assets
        run: node scripts/live-deployment-check.mjs
